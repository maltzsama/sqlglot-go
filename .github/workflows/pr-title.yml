name: PR Title

# PR titles are plain sentences; commits carry the Conventional Commit metadata.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: plain sentence title
    runs-on: ubuntu-latest
    steps:
      - name: Reject Conventional Commit prefixes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|perf|docs|refactor|test|build|ci|chore|revert)(\([^)]*\))?(!)?: ]]; then
            echo "::error::Use a plain sentence for the PR title; keep Conventional Commit prefixes in commit subjects."
            exit 1
          fi
